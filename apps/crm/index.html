<!doctype html>
<html lang="cs">
  <head>
    <meta charset="utf-8" />
    <title>Doprovázení</title>

    <!-- Pořadí v <head> je z design-system/pwa/head.html a je záměrné.
         viewport-fit=cover je to, čím se env(safe-area-inset-*) stane nenulové;
         bez něj se bezpečné zóny v pwa.css spočítají na 0 a výřez řeže obsah. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="description" content="Doprovázení pěstounských rodin" />

    <!-- MUSÍ zůstat vložený a proběhnout před prvním vykreslením, jinak
         nainstalovaná aplikace ukáže jeden světlý rámec a pak se překlopí.
         Externí <script src> se stáhne pozdě i jako blokující (pwa/README.md). -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('theme')
          var dark =
            stored === 'dark' ||
            ((stored === null || stored === 'system') &&
              window.matchMedia('(prefers-color-scheme: dark)').matches)
          var root = document.documentElement
          root.classList.toggle('dark', dark)
          root.classList.toggle('light', !dark)
        } catch (e) {}
      })()
    </script>

    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />

    <!-- Vlastní <meta name="theme-color"> nepřidávat: od chvíle, kdy se theme.js
         načte, barvu chrome vlastní on. Prohlížeč poslechne první vyhovující
         tag, takže cizí tag by mlčky vyhrál (CLAUDE.md).

         theme.js se načítá přes bundler v main.tsx, ne vlastním <script>:
         jinak by v aplikaci běžely dvě kopie modulu a každá by si držela
         vlastní stav motivu. -->
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
