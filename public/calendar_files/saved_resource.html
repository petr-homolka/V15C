@keyframes fb-fade-down {
  from { opacity: 0; transform: translateY(-6px); }
  to { opacity: 1; transform: translateY(0); }
}
@keyframes fb-fade-down-blur {
  from { opacity: 0; filter: blur(1.3px); transform: translateY(-6px); }
  to { opacity: 1; filter: blur(0px); transform: translateY(0); }
}
/* Reserve the suggestion list's full layout immediately, then animate only its
   paint. A height/grid reveal can expose rows beyond the iframe's first measured
   hit-test area, making visible suggestions temporarily unclickable. */
.fb-reveal { animation: fb-fade-down 0.2s ease-out; }
.ProseMirror { outline: none; min-height: 100px; padding-bottom: 12px; }
.ProseMirror p.is-editor-empty:first-child::after {
  content: attr(data-placeholder);
  display: block;
  margin-top: -28px;
  pointer-events: none;
  color: hsl(var(--background-accent, 227 22% 46%) / 0.6);
}
.dark .ProseMirror p.is-editor-empty:first-child::after {
  color: hsl(var(--foreground) / 0.6);
}
/* iOS Safari zooms the viewport when a focused editable control computes below
   16px. Keep this widget-only and mobile-only; desktop retains the frontend's
   compact 14/15px sizing. Checkbox/file inputs do not trigger text zoom and
   should keep their existing dimensions/visually-hidden treatment. */
#fb-feedback-root .fb-feedback-action-label-mobile {
  display: none;
}
@media (max-width: 640px) {
  #fb-feedback-root input:not([type='checkbox']):not([type='file']),
  #fb-feedback-root textarea,
  #fb-feedback-root select,
  #fb-feedback-root [contenteditable='true'] {
    font-size: 16px !important;
  }
  #fb-feedback-root .fb-feedback-action-label-desktop {
    display: none;
  }
  #fb-feedback-root .fb-feedback-action-label-mobile {
    display: inline;
  }
}
#fb-feedback-root .fb-feedback-editor-load-error {
  min-height: 110px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  gap: 10px;
  color: hsl(var(--foreground) / 0.72);
  font-size: 13px;
}
#fb-feedback-root .fb-feedback-editor-load-error button {
  border: 1px solid hsl(var(--border) / 0.7);
  background: hsl(var(--background));
}
#fb-feedback-root .fb-feedback-submission-error {
  display: flex;
  align-items: flex-start;
  gap: 8px;
  margin-top: 8px;
  padding: 10px 12px;
  border: 1px solid rgb(254 205 211);
  border-radius: 10px;
  background: rgb(255 241 242);
  color: rgb(190 18 60);
  font-size: 13px;
  font-weight: 500;
  line-height: 1.35;
}
#fb-feedback-root .fb-feedback-submission-error svg {
  width: 16px;
  height: 16px;
  flex: 0 0 16px;
  margin-top: 1px;
}
.dark #fb-feedback-root .fb-feedback-submission-error {
  border-color: rgb(244 63 94 / 0.3);
  background: rgb(244 63 94 / 0.1);
  color: rgb(253 164 175);
}
#fb-feedback-root .fb-feedback-close-confirmation-backdrop {
  position: fixed;
  inset: 0;
  z-index: 200;
  display: grid;
  place-items: center;
  padding: 20px;
  box-sizing: border-box;
  background: hsl(var(--background) / 0.82);
  backdrop-filter: blur(3px);
  -webkit-backdrop-filter: blur(3px);
  animation: fb-fade-down 0.18s ease-out;
}
#fb-feedback-root .fb-feedback-close-confirmation {
  width: min(100%, 360px);
  box-sizing: border-box;
  padding: 24px;
  border: 1px solid hsl(var(--border) / 0.65);
  border-radius: 16px;
  background: hsl(var(--background));
  color: hsl(var(--foreground));
  text-align: center;
  box-shadow: 0 10px 28px rgba(0, 0, 0, 0.12);
}
#fb-feedback-root .fb-feedback-close-confirmation-icon {
  display: flex;
  width: 40px;
  height: 40px;
  margin: 0 auto;
  align-items: center;
  justify-content: center;
  border-radius: 999px;
  background: rgba(244, 63, 94, 0.12);
  color: rgb(244, 63, 94);
}
#fb-feedback-root .fb-feedback-close-confirmation-icon svg {
  width: 21px;
  height: 21px;
}
#fb-feedback-root .fb-feedback-close-confirmation-copy {
  margin-top: 14px;
}
#fb-feedback-root .fb-feedback-close-confirmation-copy p:first-child {
  margin: 0;
  line-height: 1.35;
}
#fb-feedback-root .fb-feedback-close-confirmation-copy p:last-child {
  margin: 6px 0 0;
  color: hsl(var(--foreground));
  font-size: 14px;
  line-height: 1.45;
}
#fb-feedback-root .fb-feedback-close-confirmation-actions {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 10px;
  margin-top: 20px;
}
#fb-feedback-root .fb-feedback-close-confirmation-actions button {
  display: flex;
  width: 100%;
  min-height: 38px;
  margin: 0;
  padding: 8px 14px;
  align-items: center;
  justify-content: center;
  border-radius: 10px;
  font: inherit;
  font-size: 14px;
  font-weight: 600;
  line-height: 1;
  text-align: center;
  cursor: pointer;
  transition: background 0.16s ease, border-color 0.16s ease, color 0.16s ease;
}
#fb-feedback-root .fb-feedback-close-confirmation-cancel {
  border: 1px solid hsl(var(--border) / 0.65);
  background: hsl(var(--background));
  color: hsl(var(--foreground));
}
#fb-feedback-root .fb-feedback-close-confirmation-cancel:hover {
  background: hsl(var(--foreground) / 0.06);
}
#fb-feedback-root .fb-feedback-close-confirmation-discard {
  border: 1px solid rgb(225, 29, 72);
  background: rgb(225, 29, 72);
  color: white;
}
#fb-feedback-root .fb-feedback-close-confirmation-discard:hover {
  border-color: rgb(244, 63, 94);
  background: rgb(244, 63, 94);
}
.dark #fb-feedback-root .fb-feedback-close-confirmation {
  border-color: hsl(var(--border) / 0.42);
}
.dark #fb-feedback-root .fb-feedback-close-confirmation-cancel {
  border-color: hsl(var(--border) / 0.42);
