<!-- @dsCard group="CRM Dashboard" viewport="1440x820" name="CRM Dashboard" subtitle="Interactive click-through: login, dashboard, contacts, messenger, kanban, invoices" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><title>CraftUI CRM</title>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>
html,body{margin:0;height:100%;background:#e7e7ee;font-family:var(--font-body);overflow:hidden}
#root{height:100%;display:flex;flex-direction:column}
.nav{flex-shrink:0;height:56px;background:var(--ink-900);display:flex;align-items:center;gap:4px;padding:0 20px;position:relative;z-index:10}
.nav .brand{color:#fff;font-family:var(--font-display);font-weight:900;font-size:15px;letter-spacing:0.5px;margin-right:20px}
.nav button{background:none;border:none;color:rgba(255,255,255,0.6);font-family:var(--font-body);font-size:13px;font-weight:600;padding:8px 14px;border-radius:6px;cursor:pointer}
.nav button.active{background:var(--blue-500);color:#fff}
.stage{flex:1;position:relative;overflow:auto;display:flex;justify-content:center}
.frame{transform-origin:top center}
</style></head><body><div id="root"></div>
<script type="text/babel">
const { SignIn, Dashboard02, ContactsList01, MessagesConversation, KanbanState, InvoicesList01 } = window.CraftUICRMDesignSystem_b01735;
const SCREENS = [
  { id: 'login', label: 'Sign In', Comp: SignIn, w: 1440, h: 900 },
  { id: 'dashboard', label: 'Dashboard', Comp: Dashboard02, w: 1682, h: 1021 },
  { id: 'contacts', label: 'Contacts', Comp: ContactsList01, w: 1440, h: 1024 },
  { id: 'messenger', label: 'Messenger', Comp: MessagesConversation, w: 1440, h: 1024 },
  { id: 'kanban', label: 'Kanban', Comp: KanbanState, w: 1440, h: 1024 },
  { id: 'invoices', label: 'Invoices', Comp: InvoicesList01, w: 1440, h: 1024 },
];
function App(){
  const [active, setActive] = React.useState('dashboard');
  const stageRef = React.useRef(null);
  const [scale, setScale] = React.useState(1);
  const screen = SCREENS.find(s => s.id === active);
  React.useEffect(() => {
    function fit(){
      if(!stageRef.current) return;
      const availW = stageRef.current.clientWidth - 40;
      setScale(Math.min(1, availW / screen.w));
    }
    fit();
    window.addEventListener('resize', fit);
    return () => window.removeEventListener('resize', fit);
  }, [active]);
  const Comp = screen.Comp;
  return (<React.Fragment>
    <div className="nav">
      <span className="brand">CRAFTUI</span>
      {SCREENS.map(s => (
        <button key={s.id} className={s.id===active?'active':''} onClick={()=>setActive(s.id)}>{s.label}</button>
      ))}
    </div>
    <div className="stage" ref={stageRef}>
      <div className="frame" style={{transform:`scale(${scale})`, width: screen.w, height: screen.h * scale, marginTop: 20}}>
        <Comp />
      </div>
    </div>
  </React.Fragment>);
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body></html>
