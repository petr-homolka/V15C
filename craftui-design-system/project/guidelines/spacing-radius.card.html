<!DOCTYPE html><html><head><link rel="stylesheet" href="../styles.css"><style>
body{margin:0;padding:20px;font-family:var(--font-body);display:flex;gap:20px;align-items:center}
.box{width:90px;height:90px;background:#fff;border:1px solid var(--border-default);display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--text-secondary)}
</style></head><body>
<div class="box" style="border-radius:5px">radius sm 5</div>
<div class="box" style="border-radius:8px">radius md 8</div>
<div class="box" style="border-radius:12px">radius lg 12</div>
<div class="box" style="border-radius:12px;box-shadow:var(--shadow-card);border:none">card shadow</div>
</body></html>
