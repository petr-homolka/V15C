<!-- @dsCard group="Spacing" viewport="700x160" name="Spacing Scale" subtitle="4px-based increments used across padding/gap" -->
<!DOCTYPE html><html><head><link rel="stylesheet" href="../styles.css"><style>
body{margin:0;padding:20px;font-family:var(--font-body);display:flex;gap:10px;align-items:flex-end}
.bar{background:var(--blue-500);border-radius:3px 3px 0 0;width:28px}
.lbl{font-size:11px;text-align:center;margin-top:4px;color:var(--text-secondary)}
.col{display:flex;flex-direction:column;align-items:center}
</style></head><body>
<div class="col"><div class="bar" style="height:4px"></div><div class="lbl">4</div></div>
<div class="col"><div class="bar" style="height:8px"></div><div class="lbl">8</div></div>
<div class="col"><div class="bar" style="height:12px"></div><div class="lbl">12</div></div>
<div class="col"><div class="bar" style="height:16px"></div><div class="lbl">16</div></div>
<div class="col"><div class="bar" style="height:20px"></div><div class="lbl">20</div></div>
<div class="col"><div class="bar" style="height:24px"></div><div class="lbl">24</div></div>
<div class="col"><div class="bar" style="height:28px"></div><div class="lbl">28</div></div>
<div class="col"><div class="bar" style="height:32px"></div><div class="lbl">32</div></div>
<div class="col"><div class="bar" style="height:40px"></div><div class="lbl">40</div></div>
<div class="col"><div class="bar" style="height:48px"></div><div class="lbl">48</div></div>
</body></html>
