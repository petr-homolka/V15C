<!-- @dsCard group="Colors" viewport="700x160" name="Neutrals" subtitle="Ink, greys, borders and surfaces" -->
<!DOCTYPE html><html><head><link rel="stylesheet" href="../styles.css"><style>
body{margin:0;padding:20px;font-family:var(--font-body)}
.row{display:flex;gap:0;border-radius:8px;overflow:hidden;border:1px solid var(--border-default)}
.sw{flex:1;height:90px;display:flex;align-items:flex-end;padding:8px;font-size:12px;font-family:var(--font-display);font-weight:700}
</style></head><body>
<div class="row">
<div class="sw" style="background:var(--ink-900);color:#fff">#1C1D21<br>ink 900</div>
<div class="sw" style="background:var(--grey-500);color:#fff">#8181A5<br>grey 500</div>
<div class="sw" style="background:var(--grey-300);color:var(--ink-900)">#D6D8E0<br>grey 300</div>
<div class="sw" style="background:var(--grey-150);color:var(--ink-900)">#ECECF2<br>grey 150</div>
<div class="sw" style="background:var(--grey-100);color:var(--ink-900)">#F0F0F3<br>grey 100</div>
<div class="sw" style="background:var(--grey-50);color:var(--ink-900)">#F5F5FA<br>grey 50</div>
<div class="sw" style="background:var(--white);color:var(--ink-900);border-left:1px solid var(--border-default)">#FFFFFF<br>white</div>
</div>
</body></html>
