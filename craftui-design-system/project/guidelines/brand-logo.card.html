<!DOCTYPE html><html><head><link rel="stylesheet" href="../styles.css"><style>
body{margin:0;padding:20px;font-family:var(--font-display);display:flex;gap:16px}
.tile{flex:1;height:120px;border-radius:12px;display:flex;align-items:center;justify-content:center;gap:12px}
img{width:44px;height:44px}
span{font-size:22px;font-weight:700;letter-spacing:0.5px}
</style></head><body>
<div class="tile" style="background:#fff;border:1px solid var(--border-default)"><img src="../assets/logo/craftui-vector.svg"><span style="color:var(--ink-900)">CRAFTUI</span></div>
<div class="tile" style="background:var(--blue-500)"><img src="../assets/logo/craftui-vector.svg" style="filter:brightness(0) invert(1)"><span style="color:#fff">CRAFTUI</span></div>
</body></html>
